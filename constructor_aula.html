<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constructor de prompts · aula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --negro:#000000;
    --blanco:#FFFFFF;
    --ambar:#E0A340;
    --gris:#8A8A8A;
    --linea:rgba(255,255,255,.16);
    --ambar-tenue:rgba(224,163,64,.13);
    --fuente:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--negro);
    color:var(--blanco);
    font-family:var(--fuente);
    -webkit-font-smoothing:antialiased;
  }
  button,textarea{font-family:inherit}

  .marco{
    height:100%;
    display:flex;
    flex-direction:column;
    padding:clamp(14px,2.4vh,30px) clamp(18px,2.6vw,44px);
    gap:clamp(10px,1.6vh,20px);
  }

  /* ---------- cabecera ---------- */
  .cabecera{flex:none;display:flex;align-items:center;gap:clamp(14px,2vw,28px)}
  .cabecera h1{
    font-weight:900;
    font-size:clamp(17px,2.9vh,34px);
    letter-spacing:-.02em;
    text-transform:uppercase;
    line-height:1;
  }
  .pips{display:flex;gap:6px;margin-left:auto}
  .pip{
    width:clamp(20px,2.6vw,42px);
    height:clamp(3px,.5vh,6px);
    background:var(--linea);
    transition:background .18s ease;
  }
  .pip.on{background:var(--blanco)}
  .pip.on.quinta{background:var(--ambar)}

  /* ---------- prompt pobre ---------- */
  .pobre{
    flex:none;
    display:flex;align-items:baseline;gap:clamp(10px,1.4vw,22px);
    padding-bottom:clamp(8px,1.4vh,18px);
    border-bottom:1px solid var(--linea);
  }
  .pobre .eti{
    flex:none;
    font-size:clamp(9px,1.25vh,14px);
    letter-spacing:.12em;text-transform:uppercase;color:var(--gris);
  }
  .pobre .txt{
    color:var(--gris);
    font-size:clamp(12px,1.9vh,22px);
    line-height:1.3;
  }

  /* ---------- las cinco piezas ---------- */
  .piezas{
    flex:1;
    display:flex;flex-direction:column;
    gap:clamp(8px,1.35vh,18px);
    min-height:0;
  }
  .fila{
    flex:1;
    display:flex;align-items:stretch;
    gap:clamp(10px,1.4vw,22px);
    min-height:0;
  }
  .idx{
    flex:none;
    width:clamp(22px,2.4vw,40px);
    padding-top:clamp(4px,.7vh,9px);
    font-weight:900;
    font-size:clamp(11px,1.5vh,18px);
    color:var(--gris);
    letter-spacing:.05em;
  }
  .campo{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .rot{
    font-weight:700;
    font-size:clamp(12px,1.75vh,21px);
    letter-spacing:-.01em;
    line-height:1.15;
    margin-bottom:clamp(3px,.5vh,7px);
  }
  textarea{
    flex:1;
    width:100%;
    background:transparent;
    border:1px solid var(--linea);
    color:var(--blanco);
    padding:clamp(6px,1vh,14px) clamp(9px,1vw,18px);
    font-size:clamp(12px,1.9vh,23px);
    line-height:1.32;
    resize:none;
    min-height:0;
  }
  textarea::placeholder{color:var(--gris);opacity:1}
  textarea:focus{outline:none;border-color:rgba(255,255,255,.48)}
  textarea::-webkit-scrollbar{width:6px}
  textarea::-webkit-scrollbar-thumb{background:var(--linea)}

  .fila.quinta .idx,.fila.quinta .rot{color:var(--ambar)}
  .fila.quinta textarea{border-color:rgba(224,163,64,.42)}
  .fila.quinta textarea:focus{border-color:var(--ambar)}
  .fila.quinta textarea::placeholder{color:rgba(224,163,64,.55)}

  /* ---------- pie ---------- */
  .pie{flex:none;display:flex;align-items:center;gap:clamp(10px,1.4vw,20px);min-height:clamp(34px,5vh,58px)}
  .aviso{
    flex:1;
    display:flex;align-items:center;gap:10px;
    padding:clamp(7px,1.1vh,15px) clamp(10px,1.2vw,20px);
    background:var(--ambar-tenue);
    border-left:3px solid var(--ambar);
    font-size:clamp(11px,1.65vh,20px);
    line-height:1.3;
  }
  .aviso strong{color:var(--ambar);font-weight:700}
  .aviso[hidden]{visibility:hidden}
  .hueco{flex:1}
  .accion{
    flex:none;
    border:1px solid var(--linea);
    background:none;color:var(--blanco);cursor:pointer;
    padding:clamp(8px,1.2vh,15px) clamp(14px,1.6vw,28px);
    font-size:clamp(11px,1.6vh,19px);
    font-weight:700;
    transition:border-color .15s ease,background .15s ease,color .15s ease;
  }
  .accion:hover{border-color:rgba(255,255,255,.5)}
  .accion:focus-visible{outline:2px solid var(--ambar);outline-offset:2px}
  .accion.principal{background:var(--ambar);border-color:var(--ambar);color:var(--negro)}
  .accion.principal:hover{background:#EBB65F;border-color:#EBB65F}
  .accion[disabled]{opacity:.32;cursor:not-allowed}
  .accion[disabled]:hover{border-color:var(--linea)}

  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="marco">

  <header class="cabecera">
    <h1>Constructor de prompts</h1>
    <div class="pips" aria-hidden="true">
      <span class="pip"></span><span class="pip"></span><span class="pip"></span>
      <span class="pip"></span><span class="pip quinta"></span>
    </div>
  </header>

  <div class="pobre">
    <span class="eti">Lo que escribirías</span>
    <span class="txt" id="pobre"></span>
  </div>

  <main class="piezas" id="piezas"></main>

  <div class="pie">
    <div class="aviso" id="aviso" hidden>
      <span><strong>Te falta la quinta.</strong> Es la única que decide si aprendes algo o si te lo dan hecho.</span>
    </div>
    <div class="hueco" id="hueco"></div>
    <button class="accion principal" id="copiar" disabled>Copiar</button>
    <button class="accion" id="limpiar">Borrar</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  var PROMPT_POBRE = "hazme un resumen de por qué se estropean las baterías del móvil";

  var PIEZAS = [
    { rot:"Quién eres tú",
      ej:"Estoy en primero de grado medio y de química no tengo nada." },
    { rot:"Qué quieres que sea ella",
      ej:"Haz de compañero veterano del taller." },
    { rot:"Qué le das",
      ej:"Te describo la máquina y la avería concreta." },
    { rot:"Qué te devuelve",
      ej:"En pasos cortos, con ejemplos de mi sector." },
    { rot:"Qué no hace", quinta:true,
      ej:"No me des la solución: dame una pista y déjame intentarlo." }
  ];

  var cont      = document.getElementById("piezas");
  var elAviso   = document.getElementById("aviso");
  var elHueco   = document.getElementById("hueco");
  var btnCopiar = document.getElementById("copiar");
  var btnLimpiar= document.getElementById("limpiar");
  var pips      = [].slice.call(document.querySelectorAll(".pip"));

  document.getElementById("pobre").textContent = PROMPT_POBRE;

  var areas = PIEZAS.map(function(p,i){
    var fila = document.createElement("div");
    fila.className = "fila" + (p.quinta ? " quinta" : "");

    var idx = document.createElement("div");
    idx.className = "idx";
    idx.textContent = "0" + (i+1);
    fila.appendChild(idx);

    var campo = document.createElement("div");
    campo.className = "campo";

    var rot = document.createElement("div");
    rot.className = "rot";
    rot.textContent = p.rot;
    campo.appendChild(rot);

    var ta = document.createElement("textarea");
    ta.placeholder = p.ej;
    ta.setAttribute("aria-label", p.rot);
    ta.spellcheck = false;
    ta.addEventListener("input", pintar);
    campo.appendChild(ta);

    fila.appendChild(campo);
    cont.appendChild(fila);
    return ta;
  });

  function texto(){
    return areas.map(function(ta){ return ta.value.trim(); })
                .filter(Boolean)
                .join("\n\n");
  }

  function pintar(){
    var hechas = 0;
    areas.forEach(function(ta,i){
      var llena = ta.value.trim().length > 0;
      if (llena) hechas++;
      pips[i].classList.toggle("on", llena);
    });

    var falta = hechas > 0 && areas[4].value.trim().length === 0;
    elAviso.hidden = !falta;
    elHueco.style.display = falta ? "none" : "block";

    btnCopiar.disabled = hechas === 0;
  }

  btnCopiar.addEventListener("click", function(){
    var txt = texto();
    if (!txt) return;

    function ok(){
      btnCopiar.textContent = "Copiado";
      setTimeout(function(){ btnCopiar.textContent = "Copiar"; }, 1600);
    }
    function respaldo(){
      var tmp = document.createElement("textarea");
      tmp.value = txt; tmp.setAttribute("readonly","");
      tmp.style.position="fixed"; tmp.style.top="-1000px";
      document.body.appendChild(tmp); tmp.select();
      try { document.execCommand("copy"); ok(); }
      catch(e){ btnCopiar.textContent = "Cópialo a mano"; }
      document.body.removeChild(tmp);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok, respaldo);
    } else respaldo();
  });

  btnLimpiar.addEventListener("click", function(){
    areas.forEach(function(ta){ ta.value = ""; });
    pintar();
    areas[0].focus();
  });

  pintar();
})();
</script>
</body>
</html>
