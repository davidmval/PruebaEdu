<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mapa de proyección · beta-0</title>
<style>
  :root{
    --acento:#46C6C0; --estructura:#4A6A7A; --texto:#FFFFFF; --secundario:#C4C9CE;
    --rojo:#E0403A; --ambar:#E0A340; --marron:#A67C52; --fondo:#0B0D0F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    width:760px; height:500px; overflow:hidden; background:transparent;
    font-family:'Archivo',system-ui,-apple-system,sans-serif; color:var(--texto);
    display:flex; gap:16px;
  }
  #lienzo{width:480px; height:480px; flex:0 0 480px;}

  /* vista de móvil (?vista=lineas): solo las tres cifras */
  body.solo-lineas{
    width:100vw; height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; background:#0B0D0F;
  }
  body.solo-lineas #lienzo, body.solo-lineas #panel{display:none;}
  #resumen{display:none; text-align:center;}
  body.solo-lineas #resumen{display:block;}
  #resumen h1{font-size:20px; font-weight:600; color:var(--secundario); letter-spacing:.04em;
    text-transform:uppercase; margin-bottom:26px;}
  #resumen .b{margin-bottom:22px;}
  #resumen .et{font-size:16px; color:var(--secundario);}
  #resumen .n{font-size:64px; font-weight:700; color:var(--acento); line-height:1.05;}
  #resumen .pie{font-size:13px; color:var(--secundario); margin-top:18px;}

  /* modo limpio (?panel=0): el mapa ocupa todo el iframe */
  body.limpio{width:100vw; height:100vh; display:block; padding:0;}
  body.limpio #lienzo{
    width:100vmin; height:100vmin; flex:none; display:block; margin:0 auto;
  }
  #panel{width:248px; display:flex; flex-direction:column; gap:8px; padding-top:2px;}

  .prueba{
    background:var(--rojo); color:#fff; font-size:10px; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; padding:3px 6px; border-radius:3px;
  }
  .fila{display:flex; align-items:center; gap:6px;}
  label{font-size:12px; color:var(--secundario); width:58px;}
  select,input{
    font-family:inherit; font-size:14px; background:#14181C; color:var(--texto);
    border:1px solid var(--estructura); border-radius:4px; padding:4px 6px; width:100%;
  }
  select:focus,input:focus{outline:none; border-color:var(--acento);}
  .opcion{display:flex; align-items:center; gap:6px;}
  .letra{
    font-size:16px; font-weight:700; color:var(--acento); width:16px; text-align:center;
  }
  .opcion input{width:56px; text-align:right;}
  .pct{font-size:12px; color:var(--secundario); width:14px;}
  .calc{
    width:56px; text-align:right; padding:4px 6px; font-size:14px;
    border:1px dashed var(--estructura); border-radius:4px; color:var(--acento);
  }
  .calc.mal{color:var(--rojo); border-color:var(--rojo);}
  .nivel{font-size:11px; width:52px; text-align:right; opacity:.85;}
  .lineas{
    font-size:11px; color:var(--secundario); border-top:1px solid var(--estructura);
    padding-top:6px; line-height:1.5;
  }
  .lineas b{color:var(--acento); font-weight:700;}
  .estado{font-size:11px; color:var(--secundario); min-height:26px; line-height:1.3;}
  .botones{display:flex; gap:6px; margin-top:auto;}
  button{
    font-family:inherit; font-size:12px; background:transparent; color:var(--secundario);
    border:1px solid var(--estructura); border-radius:4px; padding:5px 8px; cursor:pointer;
  }
  button:hover{border-color:var(--acento); color:var(--acento);}
  button.principal{border-color:var(--acento); color:var(--acento);}
</style>
</head>
<body>

<canvas id="lienzo" width="960" height="960"></canvas>

<div id="resumen">
  <h1>Líneas cruzadas</h1>
  <div class="b"><div class="et">Bloque 1 · preguntas 1 a 4</div><div class="n" id="n1">—</div></div>
  <div class="b"><div class="et">Bloque 2 · preguntas 5 a 8</div><div class="n" id="n2">—</div></div>
  <div class="b"><div class="et">Bloque 3 · preguntas 9 a 12</div><div class="n" id="n3">—</div></div>
  <div class="pie" id="pie3"></div>
</div>

<div id="panel">
  

  <div class="fila">
    <label for="pregunta">Pregunta</label>
    <select id="pregunta"></select>
  </div>

  <div id="opciones"></div>

  <div class="lineas" id="lineas"></div>
  <div class="estado" id="fuente"></div>

  <div class="estado" id="estado"></div>

  <div class="botones">
    <button id="guardar" class="principal">Registrar (Intro)</button>
    <button id="reset" title="Borra todos los datos guardados">Reiniciar</button>
  </div>
</div>

<script>
/* ==================================================================
   CONFIGURACIÓN DE LA HOJA DE CÁLCULO
   Rellena ID y GID con los de tu hoja vinculada al formulario.
   Si los dejas vacíos, la página funciona solo con entrada manual.
   Columnas esperadas (las del formulario): 0 marca temporal · 1 pregunta · 2 A · 3 B · 4 C
================================================================== */
const HOJA = {
  id:  '1KZhRFbCFuE4eImdrc8bR9AsngYF1endTVuxrkAk2Ho4',
  gid: '',            // vacío = primera pestaña. Si hay varias, poner el gid de la de respuestas
  col: { marca:0, pregunta:1, a:2, b:3, c:4 },
  cada: 3000          // milisegundos entre consultas
};

/* ------------------------------------------------------------------
   TABLA DE VECTORES — VERSIÓN FINAL
   Generada desde 02_preguntas_final_beta0. Umbral de esquina: |x|+|y| >= 14.
   i = izquierda (decide el docente)   d = derecha (decide el sistema)
   a = arriba (lo común)               b = abajo (cada trayectoria)
   nivel: null | 'roja' | 'ambar' | 'marron'
------------------------------------------------------------------- */
const VECTORES = [
  [ {i:1,d:0,a:2,b:0}, {i:0,d:3,a:0,b:3,nivel:'roja'}, {i:0,d:1,a:0,b:2}, {i:0,d:1,a:2,b:0} ],
  [ {i:2,d:0,a:0,b:1}, {i:0,d:2,a:1,b:0}, {i:0,d:3,a:0,b:3,nivel:'ambar'}, {i:2,d:0,a:1,b:0} ],
  [ {i:0,d:3,a:3,b:0,nivel:'roja'}, {i:2,d:0,a:1,b:0}, {i:2,d:0,a:0,b:1}, {i:0,d:2,a:1,b:0} ],
  [ {i:1,d:0,a:2,b:0}, {i:0,d:1,a:2,b:0}, {i:0,d:3,a:3,b:0,nivel:'ambar'}, {i:0,d:1,a:0,b:2} ],
  [ {i:3,d:0,a:0,b:3,nivel:'marron'}, {i:0,d:1,a:2,b:0}, {i:1,d:0,a:2,b:0}, {i:0,d:1,a:0,b:2} ],
  [ {i:0,d:3,a:0,b:3,nivel:'ambar'}, {i:1,d:0,a:2,b:0}, {i:0,d:1,a:2,b:0}, {i:1,d:0,a:0,b:2} ],
  [ {i:2,d:0,a:1,b:0}, {i:2,d:0,a:0,b:1}, {i:0,d:3,a:3,b:0,nivel:'ambar'}, {i:0,d:2,a:1,b:0} ],
  [ {i:3,d:0,a:3,b:0,nivel:'marron'}, {i:2,d:0,a:0,b:1}, {i:0,d:2,a:1,b:0}, {i:0,d:2,a:0,b:1} ],
  [ {i:0,d:2,a:1,b:0}, {i:2,d:0,a:0,b:1}, {i:3,d:0,a:3,b:0,nivel:'marron'}, {i:2,d:0,a:1,b:0} ],
  [ {i:0,d:2,a:1,b:0}, {i:2,d:0,a:0,b:1}, {i:3,d:0,a:0,b:3,nivel:'roja'}, {i:0,d:2,a:0,b:1} ],
  [ {i:0,d:3,a:0,b:3,nivel:'roja'}, {i:0,d:1,a:2,b:0}, {i:1,d:0,a:2,b:0}, {i:1,d:0,a:0,b:2} ],
  [ {i:1,d:0,a:2,b:0}, {i:0,d:1,a:2,b:0}, {i:1,d:0,a:0,b:2}, {i:0,d:3,a:0,b:3,nivel:'marron'} ]
];

const LETRAS = ['A','B','C','D'];
const COLOR_NIVEL = {roja:'var(--rojo)', ambar:'var(--ambar)', marron:'var(--marron)'};
const CLAVE = 'beta0_recuentos_final';
const PARAMS = new URLSearchParams(location.search);
const FINAL  = PARAMS.get('final') === '1';
const BLOQUE = parseInt(PARAMS.get('bloque'), 10) || null;

/* --- geometría del mapa (mapa_2400.jpg) --- */
const LADO = 2400, ORIGEN = 1200;
const SEMIPLANO   = 12;                 // el plano va de -12 a +12: lo que la gente alcanza de verdad
const UNIDAD_POS  = 960 / SEMIPLANO;    // 80 px por unidad para situar el punto
const UNIDAD_RECT = 48;                 // el rectángulo conserva su escala: 18 x 18 = 864 px
const UNIDAD = UNIDAD_POS;
const MARGEN = FINAL ? 46 : 4;              // solo se reserva hueco si hay rótulos que pintar
const MAPA   = 960 - MARGEN * 2;
const ESCALA = MAPA / LADO;

let datos = cargar();
let animacion = null, actual = {cx:0, cy:0, w:0, h:0};
let deHoja = {};          // {pregunta: [A,B,C,D]} leído de la hoja de cálculo
let ultimaBuena = null;   // marca de tiempo de la última consulta con éxito

/* ------------------------------ estado ------------------------------ */
function cargar(){
  try{ const v = JSON.parse(localStorage.getItem(CLAVE)); return v && v.preguntas ? v : {preguntas:{}}; }
  catch(e){ return {preguntas:{}}; }
}
function guardar(){
  try{ localStorage.setItem(CLAVE, JSON.stringify(datos)); }catch(e){}
}

/* ------------------------------ interfaz ------------------------------ */
const selPregunta = document.getElementById('pregunta');
const divOpciones = document.getElementById('opciones');
const divEstado   = document.getElementById('estado');
const divLineas   = document.getElementById('lineas');

for(let p=1; p<=12; p++){
  const o = document.createElement('option');
  o.value = p; o.textContent = 'P' + p;
  selPregunta.appendChild(o);
}

divOpciones.innerHTML = LETRAS.map((L,k)=>`
  <div class="opcion">
    <span class="letra">${L}</span>
    ${k<3 ? `<input id="op${k}" type="text" inputmode="numeric" autocomplete="off">`
          : `<span class="calc" id="op3">—</span>`}
    <span class="pct">%</span>
    <span class="nivel" id="niv${k}"></span>
  </div>`).join('');

function primeraSinResponder(){
  for(let p=1; p<=12; p++) if(!datos.preguntas[p] && !deHoja[p]) return p;
  return 12;
}
selPregunta.value = primeraSinResponder();

function pintaNiveles(){
  const p = +selPregunta.value;
  VECTORES[p-1].forEach((v,k)=>{
    const el = document.getElementById('niv'+k);
    if(v.nivel && FINAL){ el.textContent = v.nivel; el.style.color = COLOR_NIVEL[v.nivel]; }
    else { el.textContent = ''; }
  });
}

function leeEntradas(){
  const vals = [];
  for(let k=0;k<3;k++){
    const t = document.getElementById('op'+k).value.trim().replace(',','.');
    vals.push(t === '' ? null : parseFloat(t));
  }
  return vals;
}

function refresca(){
  const vals = leeEntradas();
  const puestos = vals.filter(v=>v!==null && !isNaN(v));
  const elD = document.getElementById('op3');
  let d = null;

  if(puestos.length === 3){
    d = 100 - puestos.reduce((a,b)=>a+b,0);
    elD.textContent = (Math.round(d*10)/10) + '';
    elD.classList.toggle('mal', d < -0.01);
  } else {
    elD.textContent = '—';
    elD.classList.remove('mal');
  }

  const pesos = [vals[0], vals[1], vals[2], d];
  dibuja(totales(pesos));

  const n = pesos.filter(v=>v!==null && !isNaN(v) && v>=0).length;
  if(d !== null && d < -0.01){
    divEstado.innerHTML = '<span style="color:var(--rojo)">A + B + C pasan de 100.</span>';
  } else {
    divEstado.textContent = n < 4
      ? `${n} de 4 opciones · el punto es la media de lo introducido`
      : 'Las cuatro puestas. Pulsa Intro para registrar.';
  }
}

/* --------------------------- cálculo del punto --------------------------- */
function totales(pesosActuales, hasta){
  let I=0, D=0, A=0, B=0;

  // la hoja manda; lo tecleado a mano cubre las preguntas que la hoja no tenga
  const fusion = Object.assign({}, datos.preguntas, deHoja);
  for(const p in fusion){
    if(hasta && +p > hasta) continue;
    acumula(fusion[p], +p, (v)=>{ I+=v.i; D+=v.d; A+=v.a; B+=v.b; });
  }
  // la que se está tecleando, si no estaba ya registrada
  const p = +selPregunta.value;
  if(pesosActuales && !datos.preguntas[p]){
    acumula(pesosActuales, p, (v)=>{ I+=v.i; D+=v.d; A+=v.a; B+=v.b; });
  }
  return {I,D,A,B};
}

function acumula(pesos, p, sumar){
  const limpios = pesos.map(v => (v===null || isNaN(v) || v<0) ? null : v);
  const total = limpios.reduce((a,b)=> a + (b||0), 0);
  if(total <= 0) return;
  limpios.forEach((w,k)=>{
    if(w === null) return;
    const f = w / total;                       // normalizado: 50/30 pesa igual que 5/3
    const v = VECTORES[p-1][k];
    sumar({i:v.i*f, d:v.d*f, a:v.a*f, b:v.b*f});
  });
}

function lineasPorBloque(){
  // porcentaje medio de elecciones que cruzan una línea, por bloque de cuatro preguntas
  const suma = [0,0,0], cuenta = [0,0,0];
  const fusion = Object.assign({}, datos.preguntas, deHoja);
  for(const p in fusion){
    const idx = Math.floor((+p - 1) / 4);
    const pesos = fusion[p];
    const total = pesos.reduce((a,b)=> a + (b||0), 0);
    if(total <= 0) continue;
    let marcado = 0;
    VECTORES[+p-1].forEach((v,k)=>{
      if(v.nivel === 'roja' || v.nivel === 'ambar') marcado += (pesos[k]||0);
    });
    suma[idx] += marcado / total * 100;
    cuenta[idx]++;
  }
  return suma.map((s,i)=> cuenta[i] ? Math.round(s / cuenta[i]) : null);
}

function pintaLineas(){
  const b = lineasPorBloque();
  const txt = b.map((v,i)=> `B${i+1} <b>${v===null ? '—' : v + '%'}</b>`).join(' · ');
  divLineas.innerHTML = 'Líneas cruzadas: ' + txt;
  for(let i=0;i<3;i++){
    const el = document.getElementById('n'+(i+1));
    if(el) el.textContent = b[i] === null ? '—' : b[i] + ' %';
  }
  const pie = document.getElementById('pie3');
  if(pie) pie.textContent = 'Se actualiza solo · ' + new Date().toLocaleTimeString('es-ES');
}

/* ------------------------------ dibujo ------------------------------ */
const lienzo = document.getElementById('lienzo');
const ctx = lienzo.getContext('2d');
const mapa = new Image();
let mapaFallido = false;
mapa.src = 'mapa_2400.jpg';
mapa.onerror = () => {
  mapaFallido = true;
  const el = document.getElementById('fuente');
  if(el){ el.textContent = 'No se encuentra mapa_2400.jpg'; el.style.color = 'var(--rojo)'; }
  pinta();
};
mapa.onload = () => { if(!primeraCarga()) refresca(); };

function dibuja(t, sinAnimar){
  const x = (t.D - t.I) / 2, y = (t.A - t.B) / 2;
  const lim = v => Math.max(-SEMIPLANO, Math.min(SEMIPLANO, v));   // el punto nunca sale del plano
  const destino = {
    cx: MARGEN + (ORIGEN + UNIDAD_POS * lim(x)) * ESCALA,
    cy: MARGEN + (ORIGEN - UNIDAD_POS * lim(y)) * ESCALA,
    w:  UNIDAD_RECT * (t.I + t.D) * ESCALA,
    h:  UNIDAD_RECT * (t.A + t.B) * ESCALA
  };
  anima(destino, sinAnimar);
}

function anima(destino, sinAnimar){
  if(animacion) cancelAnimationFrame(animacion);
  if(sinAnimar){ actual = {...destino}; pinta(); return; }
  const inicio = {...actual}, t0 = performance.now(), DUR = 600;
  const suave = u => u<.5 ? 2*u*u : -1+(4-2*u)*u;
  function paso(ahora){
    const u = Math.min(1, (ahora - t0) / DUR), e = suave(u);
    actual = {
      cx: inicio.cx + (destino.cx - inicio.cx) * e,
      cy: inicio.cy + (destino.cy - inicio.cy) * e,
      w:  inicio.w  + (destino.w  - inicio.w)  * e,
      h:  inicio.h  + (destino.h  - inicio.h)  * e
    };
    pinta();
    if(u < 1) animacion = requestAnimationFrame(paso);
  }
  animacion = requestAnimationFrame(paso);
}

function planoDeRespaldo(){
  // plano vacío para que la sesión siga si la imagen no carga
  const o = MARGEN + ORIGEN * ESCALA, lado = LADO * ESCALA;
  ctx.save();
  ctx.fillStyle = '#0B0D0F';
  ctx.fillRect(MARGEN, MARGEN, MAPA, MAPA);
  ctx.strokeStyle = 'rgba(74,106,122,0.35)'; ctx.lineWidth = 1;
  for(let u = -SEMIPLANO; u <= SEMIPLANO; u += 3){
    const q = MARGEN + (ORIGEN + u * UNIDAD_POS) * ESCALA;
    ctx.beginPath(); ctx.moveTo(q, MARGEN); ctx.lineTo(q, MARGEN + MAPA); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(MARGEN, q); ctx.lineTo(MARGEN + MAPA, q); ctx.stroke();
  }
  ctx.strokeStyle = '#4A6A7A'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(MARGEN, o); ctx.lineTo(MARGEN + MAPA, o); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(o, MARGEN); ctx.lineTo(o, MARGEN + MAPA); ctx.stroke();
  ctx.restore();
}

function pinta(){
  const S = lienzo.width;
  ctx.clearRect(0,0,S,S);
  if(mapa.complete && mapa.naturalWidth){
    ctx.drawImage(mapa, MARGEN, MARGEN, MAPA, MAPA);
  } else {
    planoDeRespaldo();          // sin imagen, al menos los ejes y la rejilla
  }

  if(actual.w > 0.5 || actual.h > 0.5){
    ctx.save();
    ctx.strokeStyle = '#46C6C0'; ctx.lineWidth = 5;
    ctx.fillStyle = 'rgba(70,198,192,0.13)';
    ctx.shadowColor = 'rgba(70,198,192,0.6)'; ctx.shadowBlur = 18;
    const x = actual.cx - actual.w/2, y = actual.cy - actual.h/2;
    ctx.fillRect(x, y, actual.w, actual.h);
    ctx.strokeRect(x, y, actual.w, actual.h);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#46C6C0';
    ctx.beginPath(); ctx.arc(actual.cx, actual.cy, 9, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  if(FINAL){
    ctx.save();
    ctx.font = '600 26px Archivo, sans-serif';
    ctx.fillStyle = '#C4C9CE';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('LO COMÚN', S/2, MARGEN/2);
    ctx.fillText('CADA TRAYECTORIA', S/2, S - MARGEN/2);
    ctx.translate(MARGEN/2, S/2); ctx.rotate(-Math.PI/2);
    ctx.fillText('DECIDE EL DOCENTE', 0, 0);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.translate(S - MARGEN/2, S/2); ctx.rotate(Math.PI/2);
    ctx.fillText('DECIDE EL SISTEMA', 0, 0);
    ctx.restore();
  }
}

/* --------------------- lectura de la hoja de cálculo --------------------- */
function urlGviz(){
  const g = HOJA.gid ? `&gid=${HOJA.gid}` : '';
  return `https://docs.google.com/spreadsheets/d/${HOJA.id}/gviz/tq?tqx=out:json${g}&_=${Date.now()}`;
}

async function consultaHoja(){
  if(!HOJA.id) return;
  try{
    const r = await fetch(urlGviz(), {cache:'no-store'});
    const t = await r.text();
    const j = JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1));
    const filas = (j.table && j.table.rows) || [];
    const nuevo = {};
    for(const f of filas){                       // se recorre en orden: gana la última fila
      const c = f.c || [];
      if(LIMITE !== null){
        const m = marcaEnMilis(c[HOJA.col.marca]);
        if(m !== null && m < LIMITE) continue;      // fila de un ensayo anterior
      }
      const q = valor(c[HOJA.col.pregunta]);
      const a = valor(c[HOJA.col.a]), b = valor(c[HOJA.col.b]), cc = valor(c[HOJA.col.c]);
      const p = parseInt(String(q).replace(/[^0-9]/g, ''), 10);   // admite 'P1', '1', 'Pregunta 1'
      if(!p || p < 1 || p > 12) continue;
      const na = parseFloat(a), nb = parseFloat(b), nc = parseFloat(cc);
      if([na,nb,nc].some(v => isNaN(v))) continue;
      nuevo[p] = [na, nb, nc, 100 - na - nb - nc];
    }
    const cambio = JSON.stringify(nuevo) !== JSON.stringify(deHoja);
    deHoja = nuevo;
    ultimaBuena = Date.now();
    localStorage.setItem(CLAVE + '_hoja', JSON.stringify(nuevo));   // copia por si cae la red
    if(cambio){ pintaLineas(); if(!primeraCarga()) dibuja(totales(null)); }
    marcaFuente(true);
  }catch(e){
    marcaFuente(false);
  }
}

function valor(celda){ return celda ? (celda.v !== undefined ? celda.v : celda.f) : null; }

/* ?desde=hoy  o  ?desde=2026-11-20  → ignora las filas anteriores */
function limiteDesde(){
  const d = PARAMS.get('desde');
  if(!d) return null;
  if(d === 'hoy'){ const h = new Date(); h.setHours(0,0,0,0); return h.getTime(); }
  const t = Date.parse(d);
  return isNaN(t) ? null : t;
}
const LIMITE = limiteDesde();

function marcaEnMilis(celda){
  if(!celda) return null;
  const v = celda.v;
  if(typeof v === 'string' && v.startsWith('Date(')){
    const n = v.slice(5, -1).split(',').map(x => parseInt(x, 10));
    return new Date(n[0], n[1]||0, n[2]||1, n[3]||0, n[4]||0, n[5]||0).getTime();
  }
  if(v instanceof Date) return v.getTime();
  const t = Date.parse(celda.f || v);
  return isNaN(t) ? null : t;
}

function marcaFuente(ok){
  const el = document.getElementById('fuente');
  if(!el) return;
  if(!HOJA.id){ el.textContent = ''; return; }
  const seg = ultimaBuena ? Math.round((Date.now() - ultimaBuena)/1000) : null;
  el.textContent = ok ? 'Hoja conectada' : (seg === null ? 'Sin conexión con la hoja' : `Sin respuesta desde hace ${seg} s`);
  el.style.color = ok ? 'var(--acento)' : 'var(--rojo)';
}

// al arrancar, recupera la última copia guardada para no salir en blanco
try{ deHoja = JSON.parse(localStorage.getItem(CLAVE + '_hoja')) || {}; }catch(e){ deHoja = {}; }

/* ------------------------------ eventos ------------------------------ */
function registrar(){
  const vals = leeEntradas();
  if(vals.some(v => v===null || isNaN(v))) return;
  const d = 100 - vals.reduce((a,b)=>a+b,0);
  if(d < -0.01) return;
  datos.preguntas[+selPregunta.value] = [vals[0], vals[1], vals[2], d];
  guardar();
  pintaLineas();
  divEstado.textContent = 'Registrada.';
  const siguiente = primeraSinResponder();
  selPregunta.value = siguiente;
  limpiaEntradas();
  pintaNiveles();
  dibuja(totales(null));
  document.activeElement && document.activeElement.blur();   // devuelve el foco a Genially
}

function limpiaEntradas(){
  for(let k=0;k<3;k++) document.getElementById('op'+k).value = '';
  document.getElementById('op3').textContent = '—';
}

for(let k=0;k<3;k++){
  const el = document.getElementById('op'+k);
  el.addEventListener('input', refresca);
  el.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); registrar(); }
    /* las flechas NO se capturan: se dejan pasar a Genially */
  });
}
selPregunta.addEventListener('change', ()=>{ limpiaEntradas(); pintaNiveles(); refresca(); });
document.getElementById('guardar').addEventListener('click', registrar);
document.getElementById('reset').addEventListener('click', ()=>{
  if(!confirm('¿Borrar todos los recuentos guardados?')) return;
  datos = {preguntas:{}};
  guardar(); selPregunta.value = 1; limpiaEntradas(); pintaNiveles(); pintaLineas(); refresca();
});

/* --------- reproducción por pasos al entrar en la diapositiva --------- */
function reproduceBloque(){
  if(!BLOQUE) return false;
  const primera = BLOQUE * 4 - 3, ultima = BLOQUE * 4;
  const hechas = [];
  for(let q = primera; q <= ultima; q++) if(datos.preguntas[q] || deHoja[q]) hechas.push(q);
  if(!hechas.length) return false;

  dibuja(totales(null, primera - 1), true);      // estado con el que se venía, sin animar
  hechas.forEach((q, k) => {
    setTimeout(() => dibuja(totales(null, q)), 900 + k * 1000);
  });
  return true;
}

/* --------- si se registra desde otra ventana, se actualiza solo --------- */
window.addEventListener('storage', e => {
  if(e.key !== CLAVE) return;
  datos = cargar();
  pintaLineas();
  dibuja(totales(null));
});

/* el panel se puede ocultar con ?panel=0, para la proyección limpia */
if(PARAMS.get('vista') === 'lineas') document.body.classList.add('solo-lineas');
if(PARAMS.get('panel') === '0'){
  document.getElementById('panel').style.display = 'none';
  document.body.classList.add('limpio');
}

let yaReproducido = false;
function primeraCarga(){
  if(yaReproducido) return false;
  yaReproducido = true;
  return reproduceBloque();
}

pintaNiveles();
pintaLineas();
if(!primeraCarga()) refresca();

if(HOJA.id){
  consultaHoja();
  setInterval(consultaHoja, HOJA.cada);
  setInterval(()=>marcaFuente(ultimaBuena && Date.now()-ultimaBuena < HOJA.cada*3), 1000);
}
</script>
